<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Obsidian Black Canvas with subtle gold border for high contrast in all browser tabs -->
  <rect width="64" height="64" rx="14" fill="#171717" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="#B99A68" stroke-opacity="0.3" stroke-width="1" />
  
  <!-- Outer pointed Mehraab arch -->
  <path
    d="M 14 52 V 32 C 14 20 23 12 32 6 C 41 12 50 20 50 32 V 52"
    stroke="#B99A68"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Inner concentric arch line echoing traditional stone fluting -->
  <path
    d="M 21 52 V 34 C 21 24 26 18 32 14 C 38 18 43 24 43 34 V 52"
    stroke="#B99A68"
    stroke-width="2"
    stroke-opacity="0.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Keystone / finial detail at the arch apex -->
  <circle cx="32" cy="14" r="2" fill="#B99A68" />
  <path d="M 32 6 V 10" stroke="#B99A68" stroke-width="2" stroke-linecap="round" />
  
  <!-- Foundation threshold line -->
  <path d="M 10 52 H 54" stroke="#B99A68" stroke-width="2.5" stroke-linecap="round" />
</svg>
